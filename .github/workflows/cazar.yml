name: Cazar instancia Oracle

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub a veces lo retrasa un poco)
  workflow_dispatch:         # botón para ejecutarlo a mano

concurrency:
  group: cazar
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para apagarse solo cuando consigue la instancia
  issues: write    # para avisarte con un issue (te llega por correo)

jobs:
  intentar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar SDK de Oracle
        run: pip install --quiet oci

      - name: Preparar credenciales
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/clave.pem
          chmod 600 ~/.oci/clave.pem
          # Se usa el bloque [DEFAULT] tal cual lo da Oracle, cambiando solo la ruta de la llave.
          printf '%s\n' "$OCI_CONFIG" | grep -v '^key_file' > ~/.oci/config
          echo "key_file=$HOME/.oci/clave.pem" >> ~/.oci/config
          chmod 600 ~/.oci/config

      - name: Intentar crear talurio-srv
        id: cazar
        env:
          OCPUS: ${{ vars.OCPUS || '1' }}
          MEMORIA_GB: ${{ vars.MEMORIA_GB || '6' }}
          DISCO_GB: "100"
          # Clave SSH PÚBLICA (se puede compartir). La privada está solo en Bitwarden.
          CLAVE_SSH: "ssh-rsa  ssh-key-2026-10-30"
        run: python cazar.py

      - name: Apagar el cazador y avisar
        if: steps.cazar.outputs.creada == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Instancia talurio-srv creada en Oracle" \
            --body "El cazador consiguió capacidad y creó la instancia. Ya me apagué solo. Entrá a Oracle → Instancias para ver la IP pública."
          gh workflow disable cazar.yml --repo "$GITHUB_REPOSITORY"
